<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidtray - Picture to Gridfinity Box Generator</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .hidden { display: none; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        input { padding: 5px; margin: 5px; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border: 1px solid #ddd; }
        
        /* Canvas overlay styles */
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            margin: 20px 0;
        }
        
        #drawingCanvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
            pointer-events: auto;
            z-index: 10;
        }
        
        .circle-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border: 2px solid #000;
            cursor: grab;
            transform: translate(-50%, -50%);
            z-index: 15;
        }
        
        .circle-handle:active {
            cursor: grabbing;
        }
        
        .crop-outline {
            position: absolute;
            border: 3px solid red;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="section">
        <h1>Voidtray - Picture to Gridfinity Box Generator</h1>

        <div>
            <input type="file" id="fileInput" accept="image/*" required>
        </div>

        <!-- Image Preview with Canvas Overlay -->
        <div id="preview-container" class="hidden">
            <div class="canvas-wrapper" id="canvasWrapper">
                <img id="imagePreview" src="" alt="Image Preview" style="max-width: 500px;">
                <canvas id="drawingCanvas"></canvas>
            </div>
            <br>
            <button id="cropBtn">Crop Image</button>
            <button id="measureBtn">Measure Reference Object</button>
            <button id="addCircleBtn">Add Circle</button>
            <button id="clearCirclesBtn">Clear All Circles</button>
            <button id="showOutputBtn">Show Output</button>
            <button id="downloadBtn" class="hidden">Download Combined Image</button>
        </div>

        <!-- Form -->
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <input type="hidden" name="croppedImage" id="croppedImageInput">
            <input type="hidden" name="mm_per_pixel" id="mmPerPixelInput">
            
            <div>
                <label>Box Height (mm):</label>
                <input type="number" step="0.01" min="4.75" name="box_height" id="boxHeight" value="42" required>
            </div>
            
            <div id="ratioDisplay" style="margin: 10px 0; padding: 10px; background: #f0f0f0; display: none;">
                <strong>Current Scale Ratio: </strong><span id="ratioValue">Not set</span> mm/px
            </div>
            
            <button type="submit" id="uploadBtn" disabled>Upload Image</button>
            <button type="button" id="viewSTLBtn" class="hidden">View STL</button>
        </form>

        <!-- Output Preview Section -->
        <div id="output-container" class="hidden">
            <h3>Combined Output</h3>
            <canvas id="outputCanvas" style="border: 1px solid #ddd; max-width: 100%;"></canvas>
        </div>

        <!-- STL Viewer Section -->
        <div id="stl-viewer-container" class="hidden">
            <h3>STL Viewer</h3>
            <div id="stl-container" style="width: 500px; height: 500px; position: relative; margin: 20px auto; border: 1px solid #ddd;">
                <button id="loadSTLButton" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                         padding: 15px 30px; background: #4CAF50; color: white; border: none; 
                         border-radius: 5px; cursor: pointer; z-index: 100;">Load STL</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let cropper;
        let circles = [];
        let selectedCircle = null;
        let dragMode = null;
        let dragStart = { x: 0, y: 0 };
        let canvas, ctx;
        let currentImage = null;
        let measureMode = false;
        let globalPixelToMmRatio = null; // Global storage for pixel to mm ratio

        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('preview-container');
        const cropBtn = document.getElementById('cropBtn');
        const measureBtn = document.getElementById('measureBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const croppedImageInput = document.getElementById('croppedImageInput');
        const addCircleBtn = document.getElementById('addCircleBtn');
        const clearCirclesBtn = document.getElementById('clearCirclesBtn');
        const showOutputBtn = document.getElementById('showOutputBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const drawingCanvas = document.getElementById('drawingCanvas');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const outputContainer = document.getElementById('output-container');
        const outputCanvas = document.getElementById('outputCanvas');
        const viewSTLBtn = document.getElementById('viewSTLBtn');

        // STL Viewer variables
        let stlScene, stlCamera, stlRenderer, stlMesh;

        // Initialize canvas
        canvas = drawingCanvas;
        ctx = canvas.getContext('2d');

        // File input handler
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                imagePreview.src = e.target.result;
                currentImage = e.target.result;
                previewContainer.classList.remove('hidden');

                if (cropper) cropper.destroy();
                
                // Wait for image to load before creating cropper
                imagePreview.onload = function() {
                    cropper = new Cropper(imagePreview, {
                        aspectRatio: NaN,
                        viewMode: 1,
                        crop: function(event) {
                            updateCanvasForCrop();
                        }
                    });
                    
                    // Initialize canvas size
                    setTimeout(() => {
                        updateCanvasForCrop();
                    }, 100);
                };
            };
            reader.readAsDataURL(file);
        });

        // Update canvas to match cropped area
        function updateCanvasForCrop() {
            if (!cropper) return;
            
            const cropData = cropper.getData();
            const imageData = cropper.getImageData();
            const containerData = cropper.getContainerData();
            
            // Calculate scale
            const scale = imageData.width / imageData.naturalWidth;
            
            // Set canvas size to match visible cropped area
            canvas.width = cropData.width * scale;
            canvas.height = cropData.height * scale;
            
            // Position canvas over cropped area
            canvas.style.left = (cropData.x - imageData.left) * scale + 'px';
            canvas.style.top = (cropData.y - imageData.top) * scale + 'px';
            
            drawCircles();
            
            // Update red outline if in measure mode
            if (measureMode) {
                updateCropOutline(cropData, imageData, scale);
            }
        }

        // Update red outline around crop area
        function updateCropOutline(cropData, imageData, scale) {
            // Remove existing outline
            const existingOutline = document.querySelector('.crop-outline');
            if (existingOutline) {
                existingOutline.remove();
            }
            
            // Create new outline
            const outline = document.createElement('div');
            outline.className = 'crop-outline';
            outline.style.left = (cropData.x - imageData.left) * scale + 'px';
            outline.style.top = (cropData.y - imageData.top) * scale + 'px';
            outline.style.width = cropData.width * scale + 'px';
            outline.style.height = cropData.height * scale + 'px';
            
            canvasWrapper.appendChild(outline);
        }

        // Measure Reference Object button
        measureBtn.addEventListener('click', function() {
            if (!cropper) return;
            
            measureMode = !measureMode;
            
            if (measureMode) {
                // Disable cropper
                cropper.disable();
                measureBtn.textContent = 'Exit Measure Mode';
                measureBtn.style.backgroundColor = '#ff6b6b';
                
                // Show red outline
                const cropData = cropper.getData();
                const imageData = cropper.getImageData();
                const scale = imageData.width / imageData.naturalWidth;
                updateCropOutline(cropData, imageData, scale);
                
                // Initialize measurement system
                initializeMeasurementSystem();
                
            } else {
                // Re-enable cropper
                cropper.enable();
                measureBtn.textContent = 'Measure Reference Object';
                measureBtn.style.backgroundColor = '';
                
                // Remove red outline and measurement UI
                const existingOutline = document.querySelector('.crop-outline');
                if (existingOutline) {
                    existingOutline.remove();
                }
                removeMeasurementSystem();
            }
        });

        // Measurement system variables
        let measurementCanvas, measurementCtx;
        let measurementClicks = [];
        let measurementMode = 'calibrate';
        let pixelToMmRatio = null;
        let measurementScale = 1;

        function initializeMeasurementSystem() {
            // Create measurement controls
            const measurementControls = document.createElement('div');
            measurementControls.id = 'measurementControls';
            measurementControls.innerHTML = `
                <div style="margin: 10px 0; padding: 10px; border: 1px solid #ccc; background: #f9f9f9;">
                    <select id="referenceSelect"></select>
                    <br><br>
                    <input type="checkbox" id="customCheckbox">
                    <label for="customCheckbox">Use your own reference size (mm)</label>
                    <br><br>
                    <input type="text" id="referenceInput" placeholder="85.6" style="width: 100px;" value="85.6" disabled>
                    <span>mm (custom reference size)</span>
                    <br><br>
                    <div id="measurementOutput"></div>
                    <button id="checkMeasureBtn" style="display: none;">Check Distance Measurement</button>
                </div>
            `;
            
            canvasWrapper.appendChild(measurementControls);
            
            // Create measurement canvas overlay that covers the entire image
            measurementCanvas = document.createElement('canvas');
            measurementCanvas.id = 'measurementCanvas';
            measurementCanvas.style.position = 'absolute';
            measurementCanvas.style.top = '0';
            measurementCanvas.style.left = '0';
            measurementCanvas.style.pointerEvents = 'auto';
            measurementCanvas.style.cursor = 'crosshair';
            measurementCanvas.style.zIndex = '25';
            
            canvasWrapper.appendChild(measurementCanvas);
            measurementCtx = measurementCanvas.getContext('2d');
            
            // Set up measurement canvas size and position to cover entire image
            updateMeasurementCanvas();
            
            // Setup reference objects
            setupReferenceObjects();
            
            // Add measurement event listeners
            addMeasurementEventListeners();
        }

        function updateMeasurementCanvas() {
            if (!cropper || !measurementCanvas) return;
            
            const imageData = cropper.getImageData();
            measurementScale = imageData.width / imageData.naturalWidth;
            
            // Cover the entire displayed image, not just crop area
            measurementCanvas.width = imageData.width;
            measurementCanvas.height = imageData.height;
            measurementCanvas.style.left = imageData.left + 'px';
            measurementCanvas.style.top = imageData.top + 'px';
            measurementCanvas.style.width = imageData.width + 'px';
            measurementCanvas.style.height = imageData.height + 'px';
            
            redrawMeasurement();
        }

        function setupReferenceObjects() {
            const refObjects = {
                'credit card': 85.6, 
                'us business card': 88.9, 
                'us quarter': 24.26, 
                'us $1 bill': 155.956, 
                '5 mxn coin': 25.5, 
                '10 mxn coin': 28, 
                'aa battery': 14.5, 
                'aaa battery': 10.5, 
                'us penny': 19.05, 
                'us dime': 17.91, 
                '€1 coin': 23.25, 
                '£1 coin': 23.03, 
                '¥100 coin': 22.6, 
                '₹1 coin': 20, 
                '₹5 coin': 23, 
                'post-it note': 76.2
            };
            
            const referenceSelect = document.getElementById('referenceSelect');
            for (const [name, size] of Object.entries(refObjects)) {
                const option = document.createElement('option');
                option.value = size;
                option.textContent = `${name} (${size}mm)`;
                referenceSelect.appendChild(option);
            }
        }

        function addMeasurementEventListeners() {
            const referenceSelect = document.getElementById('referenceSelect');
            const customCheckbox = document.getElementById('customCheckbox');
            const referenceInput = document.getElementById('referenceInput');
            const checkMeasureBtn = document.getElementById('checkMeasureBtn');
            
            measurementCanvas.addEventListener('click', function(e) {
                const rect = measurementCanvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                measurementClicks.push({x, y});
                if (measurementClicks.length > 2) {
                    measurementClicks = [{x, y}];
                    document.getElementById('measurementOutput').innerHTML = '';
                }
                redrawMeasurement();
            });
            
            referenceSelect.addEventListener('change', function() {
                if (!customCheckbox.checked) referenceInput.value = referenceSelect.value;
                updateMeasurementCalculations();
            });
            
            referenceInput.addEventListener('input', function() {
                if (customCheckbox.checked) updateMeasurementCalculations();
            });
            
            customCheckbox.addEventListener('change', function() {
                if (customCheckbox.checked) {
                    referenceInput.disabled = false;
                    referenceSelect.disabled = true;
                } else {
                    referenceInput.disabled = true;
                    referenceSelect.disabled = false;
                    referenceInput.value = referenceSelect.value;
                }
                updateMeasurementCalculations();
            });
            
            checkMeasureBtn.addEventListener('click', function() {
                measurementMode = 'measure';
                measurementClicks = [];
                document.getElementById('measurementOutput').innerHTML = 'Measurement mode - click two points to measure distance';
                redrawMeasurement();
            });
        }

        function updateMeasurementCalculations() {
            if (measurementClicks.length === 2) {
                const dx = measurementClicks[1].x - measurementClicks[0].x;
                const dy = measurementClicks[1].y - measurementClicks[0].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (measurementMode === 'calibrate') {
                    const customCheckbox = document.getElementById('customCheckbox');
                    const referenceInput = document.getElementById('referenceInput');
                    const referenceSelect = document.getElementById('referenceSelect');
                    
                    const refSize = customCheckbox.checked ? 
                        (parseFloat(referenceInput.value) || 85.6) : 
                        parseFloat(referenceSelect.value);
                    
                    pixelToMmRatio = refSize / distance;
                    globalPixelToMmRatio = pixelToMmRatio; // Store globally
                    
                    // Update the form field and display
                    document.getElementById('mmPerPixelInput').value = globalPixelToMmRatio;
                    document.getElementById('ratioValue').textContent = globalPixelToMmRatio.toFixed(4);
                    document.getElementById('ratioDisplay').style.display = 'block';
                    
                    document.getElementById('measurementOutput').innerHTML = 
                        `Pixel distance: ${distance.toFixed(2)} px<br>` +
                        `Px to mm ratio: ${pixelToMmRatio.toFixed(4)}<br>` +
                        `Estimated mm measured: ${refSize} mm<br>` +
                        `<strong>Global ratio stored: ${globalPixelToMmRatio.toFixed(4)} mm/px</strong>`;
                    document.getElementById('checkMeasureBtn').style.display = 'block';
                } else {
                    const estimatedLength = distance * pixelToMmRatio;
                    document.getElementById('measurementOutput').innerHTML = 
                        `Pixel distance: ${distance.toFixed(2)} px<br>` +
                        `Px to mm ratio: ${pixelToMmRatio.toFixed(4)}<br>` +
                        `Estimated length: ${estimatedLength.toFixed(2)} mm`;
                }
            }
        }

        function redrawMeasurement() {
            if (!measurementCtx) return;
            
            measurementCtx.clearRect(0, 0, measurementCanvas.width, measurementCanvas.height);
            
            measurementClicks.forEach(click => {
                const x = click.x, y = click.y;
                measurementCtx.strokeStyle = measurementMode === 'calibrate' ? '#ff0000' : '#00ff00';
                measurementCtx.lineWidth = 1;
                measurementCtx.beginPath();
                measurementCtx.moveTo(x - 10, y);
                measurementCtx.lineTo(x + 10, y);
                measurementCtx.moveTo(x, y - 10);
                measurementCtx.lineTo(x, y + 10);
                measurementCtx.stroke();
            });
            
            if (measurementClicks.length === 2) {
                const x1 = measurementClicks[0].x, y1 = measurementClicks[0].y;
                const x2 = measurementClicks[1].x, y2 = measurementClicks[1].y;
                measurementCtx.strokeStyle = measurementMode === 'calibrate' ? 'rgba(255, 0, 0, 0.5)' : 'rgba(0, 255, 0, 0.5)';
                measurementCtx.lineWidth = 4;
                measurementCtx.beginPath();
                measurementCtx.moveTo(x1, y1);
                measurementCtx.lineTo(x2, y2);
                measurementCtx.stroke();
                updateMeasurementCalculations();
            }
        }

        function removeMeasurementSystem() {
            const measurementControls = document.getElementById('measurementControls');
            if (measurementControls) {
                measurementControls.remove();
            }
            
            if (measurementCanvas) {
                measurementCanvas.remove();
                measurementCanvas = null;
                measurementCtx = null;
            }
            
            // Reset measurement variables
            measurementClicks = [];
            measurementMode = 'calibrate';
            pixelToMmRatio = null;
        }

        // Add circle button
        addCircleBtn.addEventListener('click', function() {
            // If in measure mode, exit it first
            if (measureMode) {
                measureMode = false;
                cropper.enable();
                measureBtn.textContent = 'Measure Reference Object';
                measureBtn.style.backgroundColor = '';
                
                // Remove red outline and measurement UI
                const existingOutline = document.querySelector('.crop-outline');
                if (existingOutline) {
                    existingOutline.remove();
                }
                removeMeasurementSystem();
            }
            
            // Toggle add circle mode
            if (addCircleBtn.textContent === 'Add Circle') {
                addCircleBtn.textContent = 'Exit Add Circle Mode';
                addCircleBtn.style.backgroundColor = '#4CAF50';
                canvas.style.cursor = 'crosshair';
                
                // Show instruction
                const instruction = document.createElement('div');
                instruction.id = 'addCircleInstruction';
                instruction.style.cssText = 'margin: 10px 0; padding: 10px; border: 1px solid #4CAF50; background: #e8f5e8; color: #2e7d32;';
                instruction.innerHTML = 'Add Thumb holes to part - Click anywhere on the cropped image to add circles';
                canvasWrapper.appendChild(instruction);
            } else {
                addCircleBtn.textContent = 'Add Circle';
                addCircleBtn.style.backgroundColor = '';
                canvas.style.cursor = 'crosshair';
                
                // Remove instruction
                const instruction = document.getElementById('addCircleInstruction');
                if (instruction) {
                    instruction.remove();
                }
            }
        });

        // Clear circles button
        clearCirclesBtn.addEventListener('click', function() {
            circles = [];
            drawCircles();
            removeAllHandles();
        });

        // Sample color from the cropped image
        function sampleColorFromImage(x, y) {
            if (!cropper) return '#FF0000';
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            
            // Get cropped canvas from cropper
            const croppedCanvas = cropper.getCroppedCanvas();
            tempCanvas.width = croppedCanvas.width;
            tempCanvas.height = croppedCanvas.height;
            tempCtx.drawImage(croppedCanvas, 0, 0);
            
            // Scale coordinates to match the cropped canvas size
            const scaleX = croppedCanvas.width / canvas.width;
            const scaleY = croppedCanvas.height / canvas.height;
            
            const sampleX = Math.floor(x * scaleX);
            const sampleY = Math.floor(y * scaleY);
            
            // Get pixel data
            const pixelData = tempCtx.getImageData(sampleX, sampleY, 1, 1).data;
            
            // Convert to hex color
            const r = pixelData[0];
            const g = pixelData[1];
            const b = pixelData[2];
            
            return `rgb(${r}, ${g}, ${b})`;
        }

        // Draw all circles
        function drawCircles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            circles.forEach(circle => {
                ctx.beginPath();
                ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
                ctx.strokeStyle = circle.color;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Match fill to stroke color
                ctx.fillStyle = circle.color;
                ctx.fill();
            });
        }

        // Create resize handles for circles
        function createHandles() {
            removeAllHandles();
            
            circles.forEach((circle, index) => {
                // Create handle for resizing
                const handle = document.createElement('div');
                handle.className = 'circle-handle';
                handle.dataset.circleIndex = index;
                
                // Position handle on circle edge
                const handleX = circle.x + circle.radius;
                const handleY = circle.y;
                
                handle.style.left = (parseInt(canvas.style.left) + handleX) + 'px';
                handle.style.top = (parseInt(canvas.style.top) + handleY) + 'px';
                
                handle.addEventListener('mousedown', startResize);
                canvasWrapper.appendChild(handle);
            });
        }

        // Remove all handles
        function removeAllHandles() {
            document.querySelectorAll('.circle-handle').forEach(handle => handle.remove());
        }

        // Start resizing circle
        function startResize(e) {
            e.preventDefault();
            selectedCircle = parseInt(e.target.dataset.circleIndex);
            dragMode = 'resize';
            dragStart.x = e.clientX;
            dragStart.y = e.clientY;
            
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        // Canvas mouse events for moving circles and adding new circles
        canvas.addEventListener('mousedown', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // If in add circle mode, add a new circle
            if (addCircleBtn.textContent === 'Exit Add Circle Mode') {
                // Sample color from image at circle position
                const color = sampleColorFromImage(x, y);
                
                circles.push({
                    x: x,
                    y: y,
                    radius: 30,
                    color: color
                });
                
                drawCircles();
                createHandles();
                return;
            }
            
            // Check if clicking on a circle for moving
            for (let i = circles.length - 1; i >= 0; i--) {
                const circle = circles[i];
                const dist = Math.sqrt((x - circle.x) ** 2 + (y - circle.y) ** 2);
                
                if (dist <= circle.radius) {
                    selectedCircle = i;
                    dragMode = 'move';
                    dragStart.x = x - circle.x;
                    dragStart.y = y - circle.y;
                    
                    document.addEventListener('mousemove', handleDrag);
                    document.addEventListener('mouseup', stopDrag);
                    break;
                }
            }
        });

        // Handle dragging
        function handleDrag(e) {
            if (dragMode === 'move' && selectedCircle !== null) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                circles[selectedCircle].x = x - dragStart.x;
                circles[selectedCircle].y = y - dragStart.y;
                
                // Update color based on new position
                circles[selectedCircle].color = sampleColorFromImage(
                    circles[selectedCircle].x, 
                    circles[selectedCircle].y
                );
                
                drawCircles();
                createHandles();
            } else if (dragMode === 'resize' && selectedCircle !== null) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const circle = circles[selectedCircle];
                const newRadius = Math.sqrt((x - circle.x) ** 2 + (y - circle.y) ** 2);
                circle.radius = Math.max(10, newRadius);
                
                drawCircles();
                createHandles();
            }
        }

        // Stop dragging
        function stopDrag() {
            dragMode = null;
            selectedCircle = null;
            document.removeEventListener('mousemove', handleDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // Show output button - combine cropped image with circles
        showOutputBtn.addEventListener('click', function() {
            if (!cropper) return;
            
            // Get the cropped canvas
            const croppedCanvas = cropper.getCroppedCanvas();
            
            // Set output canvas size
            const outputCtx = outputCanvas.getContext('2d');
            outputCanvas.width = croppedCanvas.width;
            outputCanvas.height = croppedCanvas.height;
            
            // Draw the cropped image
            outputCtx.drawImage(croppedCanvas, 0, 0);
            
            // Draw circles on top of the image
            const scaleX = croppedCanvas.width / canvas.width;
            const scaleY = croppedCanvas.height / canvas.height;
            
            circles.forEach(circle => {
                outputCtx.beginPath();
                outputCtx.arc(
                    circle.x * scaleX, 
                    circle.y * scaleY, 
                    circle.radius * scaleX, 
                    0, 
                    Math.PI * 2
                );
                outputCtx.strokeStyle = circle.color;
                outputCtx.lineWidth = 3 * scaleX;
                outputCtx.stroke();
                outputCtx.fillStyle = circle.color;
                outputCtx.fill();
            });
            
            // Show output container and download button
            outputContainer.classList.remove('hidden');
            downloadBtn.classList.remove('hidden');
        });

        // Download button - download combined image
        downloadBtn.addEventListener('click', function() {
            outputCanvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'combined-image.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/png');
        });

        // Crop button handler
        cropBtn.addEventListener('click', function () {
            if (!cropper) return;

            const croppedCanvas = cropper.getCroppedCanvas({
                width: 500,
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });
            
            croppedCanvas.toBlob(function (blob) {
                const reader = new FileReader();
                reader.onloadend = function () {
                    croppedImageInput.value = reader.result;
                    uploadBtn.disabled = false;
                };
                reader.readAsDataURL(blob);
            }, 'image/png');
        });

        // Form submit handler
        document.getElementById('uploadForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            if (!globalPixelToMmRatio) {
                alert('Please set the scale by using "Measure Reference Object" first');
                return;
            }
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = "Processing...";
            
            try {
                const formData = new FormData();
                formData.append('croppedImage', croppedImageInput.value);
                formData.append('mm_per_pixel', globalPixelToMmRatio);
                formData.append('box_height', document.getElementById('boxHeight').value);
                
                // Add circle data
                formData.append('circles', JSON.stringify(circles));
                
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.text();
                    uploadBtn.textContent = "Upload Complete!";
                    uploadBtn.style.backgroundColor = '#4CAF50';
                    viewSTLBtn.classList.remove('hidden');
                    alert('STL file generated successfully!');
                } else {
                    throw new Error('Upload failed');
                }
            } catch (error) {
                alert('Error uploading: ' + error.message);
                uploadBtn.textContent = "Upload Image";
                uploadBtn.disabled = false;
            }
        });

        // View STL button handler
        viewSTLBtn.addEventListener('click', function() {
            const stlViewerContainer = document.getElementById('stl-viewer-container');
            stlViewerContainer.classList.remove('hidden');
            stlViewerContainer.scrollIntoView({ behavior: 'smooth' });
            
            if (!stlRenderer) {
                initSTLViewer();
            }
        });

        // STL Viewer functions
        function initSTLViewer() {
            const container = document.getElementById('stl-container');
            
            stlScene = new THREE.Scene();
            stlScene.background = new THREE.Color(0x222222);
            
            stlCamera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            stlCamera.position.z = 50;
            
            stlRenderer = new THREE.WebGLRenderer({ antialias: true });
            stlRenderer.setSize(500, 500);
            container.appendChild(stlRenderer.domElement);
            
            stlScene.add(new THREE.AmbientLight(0x404040, 0.4));
            
            const light = new THREE.DirectionalLight(0xffffff, 0.8);
            light.position.set(1, 1, 1);
            stlScene.add(light);
            
            setupSTLControls();
            animateSTL();
            
            // Setup load button
            document.getElementById('loadSTLButton').onclick = loadSTL;
        }
        
        function setupSTLControls() {
            let isDown = false, mouseX = 0, mouseY = 0;
            
            stlRenderer.domElement.onmousedown = (e) => {
                isDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            };
            
            stlRenderer.domElement.onmousemove = (e) => {
                if (isDown && stlMesh) {
                    stlMesh.rotation.y += (e.clientX - mouseX) * 0.01;
                    stlMesh.rotation.x += (e.clientY - mouseY) * 0.01;
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                }
            };
            
            stlRenderer.domElement.onmouseup = () => isDown = false;
            
            stlRenderer.domElement.onwheel = (e) => {
                stlCamera.position.z += e.deltaY * 0.1;
                stlCamera.position.z = Math.max(5, Math.min(200, stlCamera.position.z));
            };
        }
        
        async function loadSTL() {
            try {
                const response = await fetch('/static/test4.stl');
                const buffer = await response.arrayBuffer();
                const geometry = parseSTL(buffer);
                
                if (stlMesh) stlScene.remove(stlMesh);
                
                stlMesh = new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ color: 0x00ff00 }));
                
                const box = new THREE.Box3().setFromObject(stlMesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                stlMesh.position.sub(center);
                stlMesh.scale.setScalar(20 / Math.max(size.x, size.y, size.z));
                
                stlScene.add(stlMesh);
                document.getElementById('loadSTLButton').style.display = 'none';
            } catch (error) {
                alert('Error loading STL: ' + error.message);
            }
        }
        
        function parseSTL(buffer) {
            const view = new DataView(buffer);
            const triangles = view.getUint32(80, true);
            const vertices = new Float32Array(triangles * 9);
            
            let offset = 84;
            for (let i = 0; i < triangles; i++) {
                offset += 12; // skip normal
                for (let j = 0; j < 3; j++) {
                    const idx = i * 9 + j * 3;
                    vertices[idx] = view.getFloat32(offset, true);
                    vertices[idx + 1] = view.getFloat32(offset + 4, true);
                    vertices[idx + 2] = view.getFloat32(offset + 8, true);
                    offset += 12;
                }
                offset += 2; // skip attribute
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.computeVertexNormals();
            return geometry;
        }
        
        function animateSTL() {
            requestAnimationFrame(animateSTL);
            if (stlRenderer) {
                stlRenderer.render(stlScene, stlCamera);
            }
        }
    </script>
</body>
</html>
