<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to STL Processor</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .hidden { display: none; }
        #spinner { display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Upload Image to Convert</h1>

    <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" required><br><br>
        <button type="submit" id="uploadBtn">Click here to upload image</button>
    </form>

    <div id="spinner">
        <p>Processing... <img src="https://i.gifer.com/ZZ5H.gif" width="32"/></p>
    </div>

    {% if download_url %}
    <br><br>
    <a href="{{ download_url }}" download>
        <button>Click here to download STL</button>
    </a>
    {% endif %}

    <script>
        const form = document.getElementById('uploadForm');
        const spinner = document.getElementById('spinner');
        const uploadBtn = document.getElementById('uploadBtn');

        form.addEventListener('submit', function() {
            spinner.style.display = 'block';
            uploadBtn.disabled = true;
            uploadBtn.textContent = "Uploading...";
        });
    </script>
</body>
</html>
